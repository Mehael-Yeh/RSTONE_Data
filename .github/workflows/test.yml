name: Protocol and publisher tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    if: github.ref != 'refs/heads/distribution'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pytest -q
      - run: python scripts/generate_examples.py --check
      - run: python scripts/generate_casefold.py --check
  dart-protocol:
    if: github.ref != 'refs/heads/distribution'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1, exact reviewed commit
        with:
          sdk: '3.13.6'
      - name: Verify dependency lock
        working-directory: examples/flutter_protocol
        run: dart pub get --enforce-lockfile
      - name: Analyze protocol example
        working-directory: examples/flutter_protocol
        run: dart analyze
      - name: Verify Python/Dart signatures and increment planning
        working-directory: examples/flutter_protocol
        run: dart test
