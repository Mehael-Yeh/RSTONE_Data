# No checkout, artifacts, caches, credentials or environment. This is an untrusted wake-up signal only.
name: Receive upstream signal
on:
  push:
    branches: [source-signal/rstone, source-signal/tds]
permissions: {}
jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Acknowledge notification
        run: echo 'Upstream signal received; default-branch publisher will independently fetch both sources.'
