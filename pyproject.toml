[project]
name = "rstone-data"
version = "1.0.0"
description = "Signed, content-addressed RSTONE data distribution"
requires-python = ">=3.12"
dependencies = ["cryptography==46.0.3", "PyYAML==6.0.3"]

[project.scripts]
rstone-data = "rstone_data.cli:main"

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "scripts"}

[tool.pytest.ini_options]
pythonpath = ["scripts"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
