# Include in a server block serving the mirror root. Adjust root and /data prefix.
location = /data/latest.json {
    alias /srv/rstone-data/latest.json;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=60, must-revalidate" always;
    default_type application/json;
}
location ~ ^/data/(objects/[0-9a-f]{64}|manifests/[0-9]{6,}\.(json|sig))$ {
    root /srv;
    rewrite ^/data/(.*)$ /rstone-data/$1 break;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    default_type application/octet-stream;
}
location /data/ {
    alias /srv/rstone-data/;
    add_header Access-Control-Allow-Origin "*" always;
    limit_except GET HEAD OPTIONS { deny all; }
    autoindex off;
}
